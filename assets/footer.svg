<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-label="Let's build something real">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08080e"/><stop offset="1" stop-color="#0c0b18"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy="1" r=".6"><stop offset="0" stop-color="#6d28d9" stop-opacity=".35"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient>
    <mask id="m"><rect width="1200" height="160" fill="url(#fade)"/></mask>
    <clipPath id="c"><rect width="1200" height="160" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace; }
    .floor { animation: move 3s linear infinite; }
    @keyframes move { from { transform: translateY(0); } to { transform: translateY(24px); } }
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="160" fill="url(#bg)"/>
    <rect width="1200" height="160" fill="url(#glow)"/>
    <g mask="url(#m)" stroke="#8b5cf6" stroke-opacity=".3" fill="none">
      <g class="floor"><path d="M0 64H1200M0 88H1200M0 112H1200M0 136H1200M0 160H1200M0 40H1200"/></g>
      <path d="M600 20L-600 200M600 20L-200 200M600 20L150 200M600 20L420 200M600 20L600 200M600 20L780 200M600 20L1050 200M600 20L1400 200M600 20L1800 200"/>
    </g>
    <text x="600" y="72" text-anchor="middle" class="sans" font-size="28" font-weight="700" fill="#f4f4f8">Let's build something real.</text>
    <text x="600" y="104" text-anchor="middle" class="mono" font-size="13" letter-spacing="2.5" fill="#8b8ba3">HERLANHERBAS@GMAIL.COM</text>
