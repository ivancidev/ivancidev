<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="PrepAI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b14"/><stop offset="1" stop-color="#0e0d1c"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset=".6" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="600" height="250" rx="16"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace; }
    .sweep { animation: sweep 5s cubic-bezier(.6,0,.4,1) infinite; }
    @keyframes sweep { from { transform: translateX(-260px); } to { transform: translateX(600px); } }
    .a { animation: fa 4s ease-in-out infinite; } .b { animation: fb 4s ease-in-out infinite; }
    @keyframes fa { 50% { transform: translateY(-4px); } } @keyframes fb { 50% { transform: translateY(2px); } }
  </style>
  <g clip-path="url(#c)">
    <rect width="600" height="250" fill="url(#bg)"/>
    <rect width="600" height="250" fill="url(#glow)"/>
    <rect class="sweep" y="0" width="260" height="2" fill="url(#sweep)"/>
    <g transform="translate(46 47)">
      <g class="b"><path d="M0 4 L14 12 L0 20 L-14 12 Z" fill="#22d3ee" fill-opacity=".25" stroke="#22d3ee" stroke-opacity=".6"/></g>
      <g class="a"><path d="M0 -8 L14 0 L0 8 L-14 0 Z" fill="#22d3ee" fill-opacity=".55" stroke="#22d3ee"/></g>
    </g>
    <text x="72" y="45" class="mono" font-size="11" font-weight="600" letter-spacing="2" fill="#6b6b85">AI · VOICE</text>
    <text x="72" y="70" class="sans" font-size="24" font-weight="700" fill="#f4f4f8">PrepAI</text>
    <text x="568" y="52" text-anchor="end" class="mono" font-size="12" font-weight="600" letter-spacing="1.5" fill="#6b6b85">SOURCE ↗</text>
    <text x="32" y="118" class="sans" font-size="15.5" fill="#a9a9bd">Interview coach: paste a job description, answer by</text><text x="32" y="142" class="sans" font-size="15.5" fill="#a9a9bd">voice and get structured feedback. Whisper transcribes,</text><text x="32" y="166" class="sans" font-size="15.5" fill="#a9a9bd">LLaMA 3.3 evaluates.</text>
    <g transform="translate(32 196)"><rect width="69" height="26" rx="6" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/><text x="34.5" y="17.5" text-anchor="middle" class="mono" font-size="13" fill="#b4b4c8">NestJS</text></g><g transform="translate(109 196)"><rect width="69" height="26" rx="6" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/><text x="34.5" y="17.5" text-anchor="middle" class="mono" font-size="13" fill="#b4b4c8">Prisma</text></g><g transform="translate(186 196)"><rect width="100" height="26" rx="6" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/><text x="50" y="17.5" text-anchor="middle" class="mono" font-size="13" fill="#b4b4c8">PostgreSQL</text></g><g transform="translate(294 196)"><rect width="53" height="26" rx="6" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/><text x="26.5" y="17.5" text-anchor="middle" class="mono" font-size="13" fill="#b4b4c8">Groq</text></g>
  </g>
  <rect x=".5" y=".5" width="599" height="249" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
