<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Ivan Herlan Herbas - Full Stack Developer: Web, Mobile and AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080e"/>
      <stop offset="1" stop-color="#0c0b18"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6d28d9" stop-opacity=".38"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".7"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".9"/>
    </linearGradient>
    <mask id="floorMask"><rect x="0" y="230" width="1200" height="130" fill="url(#floorFade)"/></mask>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0"/>
      <stop offset=".5" stop-color="#c4b5fd" stop-opacity=".55"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="360" rx="20"/></clipPath>

    <!-- one isometric slab: a=110, b=63.5, thickness=18, centered at 0,0 -->
    <g id="top"><path d="M0 -63.5 L110 0 L0 63.5 L-110 0 Z"/></g>
    <g id="left"><path d="M-110 0 L0 63.5 L0 81.5 L-110 18 Z"/></g>
    <g id="right"><path d="M0 63.5 L110 0 L110 18 L0 81.5 Z"/></g>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace; }
    .in { opacity: 0; animation: rise 1s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .45s; }
    .d4 { animation-delay: .6s; } .d5 { animation-delay: .75s; } .d6 { animation-delay: .9s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .s1 { animation: f1 6s ease-in-out infinite; }
    .s2 { animation: f2 6s ease-in-out infinite; }
    .s3 { animation: f3 6s ease-in-out infinite; }
    .s4 { animation: f4 6s ease-in-out infinite; }
    @keyframes f1 { 50% { transform: translateY(-16px); } }
    @keyframes f2 { 50% { transform: translateY(-9px); } }
    @keyframes f3 { 50% { transform: translateY(-3px); } }
    @keyframes f4 { 50% { transform: translateY(3px); } }
    .packet { animation: flow 3.2s cubic-bezier(.5,0,.5,1) infinite; }
    .p2 { animation-delay: 1.6s; }
    @keyframes flow { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(180px); opacity: 0; } }
    .shine { animation: shine 6s ease-in-out infinite; }
    @keyframes shine { 0%, 100% { opacity: .35; } 50% { opacity: .8; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>

    <!-- perspective floor -->
    <g mask="url(#floorMask)" stroke="#8b5cf6" stroke-opacity=".28" fill="none">
      <path d="M0 250H1200M0 262H1200M0 278H1200M0 300H1200M0 330H1200M0 370H1200"/>
      <path d="M930 200L-400 400M930 200L-100 400M930 200L200 400M930 200L480 400M930 200L740 400M930 200L930 400M930 200L1120 400M930 200L1380 400M930 200L1700 400"/>
    </g>

    <ellipse cx="900" cy="190" rx="300" ry="190" fill="url(#glow)"/>
    <ellipse cx="900" cy="338" rx="150" ry="24" fill="url(#shadow)"/>

    <!-- isometric full-stack (exploded view) -->
    <g transform="translate(900 0)">
      <rect class="shine" x="-1" y="40" width="2" height="250" fill="url(#beam)"/>

      <!-- DATA -->
      <g class="s4"><g transform="translate(0 254)">
        <use href="#left" fill="#334155" fill-opacity=".55"/>
        <use href="#right" fill="#1e293b" fill-opacity=".7"/>
        <use href="#top" fill="#64748b" fill-opacity=".14" stroke="#94a3b8" stroke-opacity=".7"/>
        <path d="M110 0H134" stroke="#cbd5e1" stroke-opacity=".5"/><text x="142" y="-2" class="mono" font-size="13" font-weight="700" letter-spacing="3" fill="#cbd5e1">DATA</text><text x="142" y="15" class="mono" font-size="11" fill="#8b8ba3">PostgreSQL · Vector DB</text>
      </g></g>
      <!-- API -->
      <g class="s3"><g transform="translate(0 201)">
        <use href="#left" fill="#3730a3" fill-opacity=".55"/>
        <use href="#right" fill="#1e1b4b" fill-opacity=".8"/>
        <use href="#top" fill="#6366f1" fill-opacity=".16" stroke="#818cf8" stroke-opacity=".8"/>
        <path d="M110 0H134" stroke="#c7d2fe" stroke-opacity=".5"/><text x="142" y="-2" class="mono" font-size="13" font-weight="700" letter-spacing="3" fill="#c7d2fe">API</text><text x="142" y="15" class="mono" font-size="11" fill="#8b8ba3">NestJS · FastAPI</text>
      </g></g>
      <!-- AI -->
      <g class="s2"><g transform="translate(0 148)">
        <use href="#left" fill="#0e7490" fill-opacity=".55"/>
        <use href="#right" fill="#083344" fill-opacity=".8"/>
        <use href="#top" fill="#22d3ee" fill-opacity=".14" stroke="#67e8f9" stroke-opacity=".85"/>
        <path d="M110 0H134" stroke="#a5f3fc" stroke-opacity=".5"/><text x="142" y="-2" class="mono" font-size="13" font-weight="700" letter-spacing="3" fill="#a5f3fc">AI</text><text x="142" y="15" class="mono" font-size="11" fill="#8b8ba3">RAG · Agents · LLMs</text>
      </g></g>
      <!-- UI -->
      <g class="s1"><g transform="translate(0 95)">
        <use href="#left" fill="#6d28d9" fill-opacity=".6"/>
        <use href="#right" fill="#2e1065" fill-opacity=".85"/>
        <use href="#top" fill="#8b5cf6" fill-opacity=".2" stroke="#c4b5fd" stroke-opacity=".9"/>
        <path d="M110 0H134" stroke="#ede9fe" stroke-opacity=".5"/><text x="142" y="-2" class="mono" font-size="13" font-weight="700" letter-spacing="3" fill="#ede9fe">UI</text><text x="142" y="15" class="mono" font-size="11" fill="#8b8ba3">React · Next.js · RN</text>
      </g></g>

      <!-- data packets travelling through the layers -->
      <rect class="packet" x="-3" y="80" width="6" height="6" fill="#e9d5ff" transform="rotate(0)"/>
      <rect class="packet p2" x="-3" y="80" width="6" height="6" fill="#a5f3fc"/>
    </g>

    <!-- copy -->
    <text x="80" y="92" class="mono in d1" font-size="13" font-weight="600" letter-spacing="3.5" fill="#8b8ba3">FULL STACK DEVELOPER</text>
    <text x="78" y="150" class="sans in d2" font-size="58" font-weight="700" letter-spacing="-1" fill="#f4f4f8">Ivan Herlan Herbas</text>
    <rect x="80" y="170" width="56" height="3" rx="1.5" fill="#8b5cf6" class="in d3"/>
    <text x="80" y="206" class="sans in d3" font-size="21" fill="#b4b4c8">Web, mobile and AI products, from interface to infrastructure.</text>

    <g class="sans in d4" font-size="16" fill="#d6d6e2">
      <rect x="82" y="238" width="8" height="8" transform="rotate(45 86 242)" fill="#8b5cf6"/>
      <text x="102" y="248">RAG search over legal and business documents</text>
    </g>
    <g class="sans in d5" font-size="16" fill="#d6d6e2">
      <rect x="82" y="268" width="8" height="8" transform="rotate(45 86 272)" fill="#22d3ee"/>
      <text x="102" y="278">AI agents and automations for WhatsApp, OCR and ops</text>
    </g>
    <g class="sans in d6" font-size="16" fill="#d6d6e2">
      <rect x="82" y="298" width="8" height="8" transform="rotate(45 86 302)" fill="#818cf8"/>
      <text x="102" y="308">Payroll, HR and real-time collaboration platforms</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".07"/>
</svg>
